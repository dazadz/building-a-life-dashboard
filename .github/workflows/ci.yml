name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  privacy:
    name: No personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject database files and large files
        run: |
          bad=$(git ls-files | grep -E '\.(db|sqlite)(-wal|-shm)?$|(^|/)\.samuel/' || true)
          if [ -n "$bad" ]; then echo "Database files are tracked:"; echo "$bad"; exit 1; fi
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 1024 {print $2}' | grep -v 'package-lock.json' || true)
          if [ -n "$big" ]; then echo "Files over 1 MB:"; echo "$big"; exit 1; fi
