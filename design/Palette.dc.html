<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#10121A}
a{color:#BDB2FF;text-decoration:none}a:hover{color:#DCD6FF}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 780px; overflow: hidden; background: #10121A; color: #F6F5FC; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.45;">

  <!-- Dimmed app behind -->
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex;">
    <div style="width: 232px; background: #151823; border-right: 1px solid #272C3D;"></div>
    <div style="flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 20px;">
      <div style="width: 160px; height: 12px; border-radius: 6px; background: #272C3D;"></div>
      <div style="width: 380px; height: 28px; border-radius: 8px; background: #272C3D;"></div>
      <div style="display: flex; gap: 20px;"><div style="flex: 2; height: 260px; border-radius: 16px; background: #1B1E2B; border: 1px solid #2C3145;"></div><div style="flex: 1; height: 260px; border-radius: 16px; background: #1B1E2B; border: 1px solid #2C3145;"></div></div>
      <div style="display: flex; gap: 20px;"><div style="flex: 1; height: 260px; border-radius: 16px; background: #1B1E2B; border: 1px solid #2C3145;"></div><div style="flex: 1; height: 260px; border-radius: 16px; background: #1B1E2B; border: 1px solid #2C3145;"></div><div style="flex: 1; height: 260px; border-radius: 16px; background: #1B1E2B; border: 1px solid #2C3145;"></div></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8, 8, 11, 0.72);"></div>

  <!-- Palette -->
  <div role="dialog" aria-modal="true" aria-label="Command palette" style="position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: 640px; box-sizing: border-box; background: #1B1E2B; border: 1px solid #383F57; border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 60px; border-bottom: 1px solid #2C3145;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search or run a command</label>
      <input id="cmd" type="text" value="budget" style="flex: 1; min-width: 0; height: 44px; background: transparent; border: 0; outline: none; color: #F6F5FC; font: inherit; font-size: 17px;">
      <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B3B1C7; background: #272C3D; border: 1px solid #383F57; border-radius: 6px; padding: 2px 6px;">Esc</kbd>
    </div>

    <div role="listbox" aria-label="Results" style="padding: 8px; display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div style="padding: 10px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9D9BB3;">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
          <div role="option" aria-selected="{{r.selected}}" style="{{r.rowStyle}}">
            <span style="width: 32px; height: 32px; flex: 0 0 32px; border-radius: 8px; background: #272C3D; color: {{r.iconColor}}; display: flex; align-items: center; justify-content: center;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
            </span>
            <div style="flex: 1; min-width: 0;">
              <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</div>
              <div style="font-size: 12px; color: #B3B1C7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.meta}}</div>
            </div>
            <sc-if value="{{r.selected}}" hint-placeholder-val="{{ false }}">
              <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F6F5FC; background: #383F57; border-radius: 6px; padding: 2px 8px;">↵ Open</kbd>
            </sc-if>
          </div>
        </sc-for>
      </sc-for>
    </div>

    <div style="display: flex; gap: 18px; align-items: center; padding: 0 18px; height: 44px; border-top: 1px solid #2C3145; font-size: 12px; color: #B3B1C7;">
      <span><kbd style="font-family: 'JetBrains Mono', monospace; color: #D8D6E6;">↑↓</kbd> Navigate</span>
      <span><kbd style="font-family: 'JetBrains Mono', monospace; color: #D8D6E6;">↵</kbd> Open</span>
      <span><kbd style="font-family: 'JetBrains Mono', monospace; color: #D8D6E6;">Tab</kbd> More actions</span>
      <span style="flex: 1;"></span>
      <span>Type <kbd style="font-family: 'JetBrains Mono', monospace; color: #D8D6E6;">&gt;</kbd> for commands, <kbd style="font-family: 'JetBrains Mono', monospace; color: #D8D6E6;">?</kbd> to ask Samuel</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9B87FF","options":["#9B87FF","#5CC8FF","#45E0B4","#FFB35C","#FF7EB3"]},"$preview":{"width":1200,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#9B87FF';
    const n = parseInt(accent.slice(1), 16);
    const accentSoft = 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',0.16)';
    const ICON = {
      task: 'M3 7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM8 12l3 3 5-6',
      folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      journal: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',
      plus: 'M12 5v14M5 12h14',
      spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z'
    };
    const row = (icon, title, meta, selected) => ({
      icon: ICON[icon], title, meta, selected: !!selected,
      iconColor: selected ? accent : '#D8D6E6',
      rowStyle: { display: 'flex', alignItems: 'center', gap: '12px', minHeight: '48px', padding: '6px 12px', borderRadius: '10px', background: selected ? accentSoft : 'transparent', cursor: 'pointer' }
    });
    const groups = [
      { name: 'Tasks', items: [
        row('task', 'Add hiring costs to Q4 budget', 'Today · 14:00 · Work · High priority', true)
      ] },
      { name: 'Goals', items: [
        row('folder', 'Promotion to senior analyst', 'Career · 40% · next: ship Q4 budget proposal')
      ] },
      { name: 'Check-ins', items: [
        row('journal', 'Thursday 22 October · score 74', 'Failures: “…the budget meeting ran long, so I lost the afternoon focus block…”')
      ] },
      { name: 'Actions', items: [
        row('plus', 'Create task “budget”', 'Adds to Today'),
        row('spark', 'Ask Samuel about “budget”', 'Runs with Claude Code across tasks, goals and check-ins')
      ] }
    ];
    return { accent, groups };
  }
}
</script>
</body>
</html>
